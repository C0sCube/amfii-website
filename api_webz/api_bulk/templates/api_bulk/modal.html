{% load static %}

<script src="{% static 'js/api_bulk/modal.js' %}"></script>

<div class="modal fade" id="bulkForm" tabindex="-1" aria-labelledby="bulkFormLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <!-- Header -->
            <div class="modal-header">
                <h5 class="modal-title" id="bulkFormLabel">
                    Create Bulk Download Task
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!-- Body -->
            <div class="modal-body">

                <!-- <div class="mb-4">
                    <h6 class="text-primary fw-bold">Task Information</h6>
                    <hr>
                </div> -->

                <div class="row mb-3 align-items-center">
                    <div class="col-md-3">
                        <label for="taskName" class="form-label fw-semibold">
                            <h6 class="text-primary fw-bold">TASK NAME</h6>
                        </label>
                    </div>

                    <div class="col-md-9">
                        <input type="text" class="form-control" id="taskName" name="task_name" , placeholder="Task #1">
                    </div>
                </div>

                <!-- <div class="row mb-3 align-items-center">
                    <div class="col-md-3">
                        <label for="siteName" class="form-label fw-semibold">
                           <h6 class="text-primary fw-bold">BASE SITE</h6>
                        </label>
                    </div>

                    <div class="col-md-9">
                        <input type="text" class="form-control" id="siteUrl" name="site_name" ,
                            placeholder="https://www.amfiindia.com/">
                    </div>
                </div> -->
                <div class="row mb-3 align-items-center">
                    <div class="col-md-3">
                        <label for="apiName" class="form-label fw-semibold">
                            <h6 class="text-primary fw-bold">API URL</h6>
                        </label>
                    </div>

                    <div class="col-md-9">
                        <input type="text" class="form-control" id="apiUrl" name="api_name" ,
                            placeholder="https://www.amfiindia.com/api/distributor-agent">
                    </div>
                </div>

                <div class="row mb-4 align-items-center">
                    <div class="col-md-3">
                        <label for="taskThrottle" class="form-label fw-semibold">
                            Throttle (sec)
                        </label>
                    </div>

                    <div class="col-md-3">
                        <input type="number" class="form-control" id="taskThrottle" , name="throttle" , value="0"
                            min="0">
                    </div>
                    <div class="col-md-3">
                        <label for="taskThrottle" class="form-label fw-semibold">
                            Verify
                        </label>
                    </div>

                    <div class="col-md-3">
                        <select class="form-control" id="taskVerify" name="verify">
                            <option value="true">True</option>
                            <option value="false">False</option>
                        </select>
                    </div>

                </div>

                <div class="row mb-4 align-items-center">
                    <div class="col-md-3">
                        <label for="requestType" class="form-label fw-semibold">
                            RequestType
                        </label>
                    </div>

                    <div class="col-md-3">
                        <select class="form-control" id="requestType" name="requestType">
                            <option value="true">GET</option>
                            <option value="false">POST</option>
                            <option value="true">PUT</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="fileExtension" class="form-label fw-semibold">
                            ExpectedType
                        </label>
                    </div>

                    <div class="col-md-3">
                        <input type="string" class="form-control" id="fileExtension" , name="fileType" , value=".pdf">
                    </div>
                </div>

                <!-- <div class="mb-4">
                    <h6 class="text-primary fw-bold">Request Settings</h6>
                    <hr>
                </div> -->

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="taskHeaders" class="form-label fw-semibold">
                            Headers
                        </label>
                    </div>
                    <div class="col-md-6">
                        <label for="taskHeaders" class="form-label fw-semibold">
                            Skeleton
                        </label>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <textarea class="form-control" id="taskHeaders" name="headers" rows="8">{"Accept": "*/*", "Accept-Encoding": "gzip, deflate, br", "Connection": "keep-alive",  "Referer": "https://example.com/init", "Accept-Language": "en-US,en;q=0.9", "Content-Type": "", "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}</textarea>
                    </div>

                    <div class="col-md-6">
                        <textarea class="form-control" id="skeleton" name="skeleton" rows="8">{}</textarea>
                        
                    </div>
                </div>

                <!-- <div class="mb-4">
                    <h6 class="text-primary fw-bold">Input Data</h6>
                    <hr>
                </div> -->

                <div class="row align-items-center">
                    <!-- <div class="col-md-2">
                        <label for="taskFile" class="form-label fw-semibold">
                            Files
                        </label>
                    </div> -->

                <div class="col-md-6">
                    <input class="form-control" type="file" id="taskFile" , name="csv_file" , accept=".csv">

                    <!-- <small class="text-muted">
                            Upload a CSV containing download URLs.
                        </small> -->
                </div>

                <div class="col-md-2">
                    <label for="taskFile" class="form-label fw-semibold">
                        pagination
                    </label>
                </div>

                <div class="col-md-4">
                    <input class="form-control" type="text" id="pagination" , name="pagination" , accept=".csv">
                </div>
            </div>

        </div>

        <!-- Footer -->
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                Cancel
            </button>

            <button type="button" class="btn btn-primary" onclick="createBulkTask()">
                Create Task
            </button>
        </div>

    </div>
</div>
</div>
