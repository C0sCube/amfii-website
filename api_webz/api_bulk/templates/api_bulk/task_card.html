<div class="col-xl-3 col-lg-3 col-md-6 col-12 mb-3">
  <div class="card shadow-sm h-100">
    <div class="card-body">
      <!-- Header -->
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <h5 class="mb-1 font-weight-bold text-gray-800">{{ task.name }}</h5>
          <small class="text-gray-500"> Task: {{ task.id }} </small>
        </div>

        <span class="badge bg-primary"> {{ task.status }} </span>
      </div>

      <!-- Progress -->
      <div class="mt-3">
        <div class="d-flex justify-content-between small mb-1">
          <span>Progress</span>
          <span> {{ task.downloaded_files }}/{{ task.total_files }} </span>
        </div>

        <div class="progress" style="height: 8px">
          <div class="progress-bar" style="width: 68%"></div>
        </div>
      </div>

      <!-- Info -->
      <div class="row mt-3 small text-gray-600">
        <div class="col-6">
            <strong>Owner</strong><br />

            {% for owner in task.owner %}
                {{ owner }}{% if not forloop.last %}, {% endif %}
            {% empty %}
                -
            {% endfor %}
        </div>

        <div class="col-3">
          <strong>Throttle</strong><br />
          {{ task.throttle }} sec
        </div>

        <div class="col-3">
          <strong>Failed</strong><br />
          <span class="text-danger"> {{ task.failed_files }} </span>
        </div>
      </div>

      <!-- Actions -->
      <div class="d-flex justify-content-end mt-3 pt-2 border-top">
        <button
          type="button"
          class="btn btn-sm btn-primary me-2"
          data-bs-toggle="modal"
          data-bs-target="#taskDetailModal-{{ task.id }}"
        >
          View Task
        </button>

        <button
          type="button"
          class="btn btn-sm btn-danger"
          data-task-id="{{ task.id }}"
        >
          Delete
        </button>
      </div>
    </div>
  </div>
</div>
