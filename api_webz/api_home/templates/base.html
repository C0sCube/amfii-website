{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no"
  />
  <meta name="description" content="" />
  <meta name="author" content="" />

  <title>API Administrator</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="{% static 'css/api_home/style.min.css' %}" />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
  />
  <link rel="icon" type="image/x-icon" href="{% static 'img/NSE.ico' %}" />
</head>


<body id="page-top" class="{% block body_class %}{% endblock %}">
    <div id="wrapper">
        <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
            {% include 'logo.html' %}
            <!-- SIDE BAR CONTENT GOES HERE -->
            {% block sidebar %}{% endblock %}
            <hr class="sidebar-divider my-0" />

            <li class="nav-item">
                <a class="nav-link" href="{% url 'home' %}">

                <span>Task Manager</span>
                </a>

            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'bulk_home' %}">

                <span>Bulk Download</span>
                </a>

            </li>


            <li class="nav-item">
                <a class="nav-link collapsed" href="{% url 'week' %}" data-toggle="collapse" data-target="#collapseTwo"
                aria-expanded="true" aria-controls="collapseTwo">

                <span>Week Schedule</span>
                </a>
                <!-- <div id="collapseTwo" class="collapse" aria-labelledby="headingTwo" data-parent="#accordionSidebar">
                            <div class="bg-white py-2 collapse-inner rounded">
                                <h6 class="collapse-header">Custom Components:</h6>
                                <a class="collapse-item" href="buttons.html">Buttons</a>
                                <a class="collapse-item" href="cards.html">Cards</a>
                            </div>
                        </div> -->
            </li>
            <hr class="sidebar-divider">
        </ul>
        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">
                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
                    <!-- NAV BAR CONTENT GOES HERE -->
                    {% block navbar %}{% endblock %}
                    <div class="topbar-divider d-none d-sm-block"></div>
                    {% include 'logout.html' %}
                </nav>
                <div class="container-fluid">
                    <!-- CONTENT GOES HERE -->
                     {% block container %}{% endblock %}
                </div>
            </div>
            <!-- End of Main Content -->
            <!-- <footer class="sticky-footer bg-white">
            </footer> -->

        </div>
        <!-- End of Content Wrapper -->
    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>        
<!-- ================= SCRIPTS ================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}

</body>

</html>
